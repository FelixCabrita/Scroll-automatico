<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Auto Scroll</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      background: #0f0f0f;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      padding: 20px;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      transition: background 0.3s;
    }

    h1.active::before {
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
    }

    /* Boton principal */
    #toggleBtn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      background: #1d4ed8;
      color: #fff;
      margin-bottom: 18px;
    }

    #toggleBtn:hover { background: #2563eb; }
    #toggleBtn:active { transform: scale(0.97); }
    #toggleBtn.running { background: #dc2626; }
    #toggleBtn.running:hover { background: #ef4444; }

    /* Velocidad */
    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .label-row span { color: #aaa; font-size: 13px; }
    .label-row strong { color: #fff; font-size: 15px; }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #333;
      outline: none;
      margin-bottom: 18px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #1d4ed8;
      cursor: pointer;
      transition: background 0.2s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      background: #2563eb;
    }

    /* Toggle bucle */
    .loop-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding: 10px 12px;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      background: #141414;
    }

    .loop-row span { font-size: 13px; color: #ccc; }

    .toggle-switch {
      position: relative;
      width: 38px;
      height: 21px;
    }

    .toggle-switch input { display: none; }

    .toggle-switch .track {
      position: absolute;
      inset: 0;
      background: #333;
      border-radius: 21px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-switch input:checked + .track { background: #1d4ed8; }

    .toggle-switch .track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s;
    }

    .toggle-switch input:checked + .track::after {
      transform: translateX(17px);
    }

    /* Botones secundarios */
    .secondary-row {
      display: flex;
      gap: 8px;
    }

    .secondary-row button {
      flex: 1;
      padding: 8px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #1a1a1a;
      color: #ccc;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .secondary-row button:hover {
      background: #2a2a2a;
      color: #fff;
    }

    /* Atajo */
    .shortcut {
      margin-top: 16px;
      text-align: center;
      font-size: 11px;
      color: #555;
    }

    .shortcut kbd {
      background: #222;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 11px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1 id="title">Auto Scroll</h1>

  <button id="toggleBtn">▶ Iniciar</button>

  <div class="label-row">
    <span>Velocidad</span>
    <strong><span id="speedVal">50</span> px/s</strong>
  </div>
  <input type="range" id="speedSlider" min="5" max="300" step="5" value="50" />

  <div class="loop-row">
    <span>⟳ Bucle automatico</span>
    <label class="toggle-switch">
      <input type="checkbox" id="loopToggle" />
      <span class="track"></span>
    </label>
  </div>

  <div class="secondary-row">
    <button id="resetBtn">⟲ Volver arriba</button>
    <button id="slowBtn">− Más lento</button>
    <button id="fastBtn">+ Más rápido</button>
  </div>

  <p class="shortcut">Atajo: <kbd>Alt</kbd> + <kbd>S</kbd></p>

  <script src="popup.js"></script>
</body>
</html>
